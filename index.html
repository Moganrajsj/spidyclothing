    {
      "@context": "https://schema.org",

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "Spidy Clothing",
      "url": "https://spidyclothing.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://spidyclothing.in/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
